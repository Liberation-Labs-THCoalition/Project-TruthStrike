<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TruthStrike: Full Debunk</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #2c3e50;
      padding: 30px;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    h1 {
      color: #764ba2;
      margin: 0 0 10px 0;
      font-size: 28px;
    }
    .category {
      background: #667eea;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .section {
      margin: 25px 0;
    }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #764ba2;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    .section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: #667eea;
      margin-right: 10px;
      border-radius: 2px;
    }
    .claim-truth {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #ff6b6b;
    }
    .claim-truth.truth {
      border-left-color: #51cf66;
    }
    .claim {
      font-weight: 600;
      color: #e74c3c;
      margin-bottom: 8px;
    }
    .truth {
      color: #27ae60;
    }
    .source {
      font-size: 12px;
      color: #7f8c8d;
      font-style: italic;
      margin-top: 6px;
    }
    .money-trail {
      background: #fff3cd;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #ffc107;
    }
    .real-problem {
      background: #ffe5e5;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #ff6b6b;
      font-weight: 500;
    }
    .resources {
      list-style: none;
      padding: 0;
    }
    .resources li {
      padding: 10px;
      background: #f8f9fa;
      margin: 8px 0;
      border-radius: 6px;
    }
    .resources a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    .resources a:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">
      <p>Loading debunk information...</p>
    </div>
    <div id="content" style="display: none;">
      <h1 id="title">Debunking Disinformation</h1>
      <span class="category" id="category">Category</span>

      <div class="section">
        <div class="section-title">Claim vs. Truth</div>
        <div id="facts"></div>
      </div>

      <div class="section" id="money-section">
        <div class="section-title">💰 Money Trail</div>
        <div class="money-trail" id="money-trail"></div>
      </div>

      <div class="section" id="problem-section">
        <div class="section-title">⚠️ The Real Problem</div>
        <div class="real-problem" id="real-problem"></div>
      </div>

      <div class="section" id="resources-section">
        <div class="section-title">📚 Trusted Resources</div>
        <ul class="resources" id="resources"></ul>
      </div>
    </div>
  </div>

  <script src="debunk.js"></script>
</body>
</html>
