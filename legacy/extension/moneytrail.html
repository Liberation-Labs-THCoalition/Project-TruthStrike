<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TruthStrike: Follow the Money</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
      margin: 0;
    }
    .header {
      background: linear-gradient(135deg, #cc0000, #ff3333);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      color: white;
      font-size: 24px;
    }
    .subtitle {
      color: #ffcccc;
      margin-top: 5px;
    }
    .organization {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #cc0000;
    }
    .org-name {
      font-size: 20px;
      font-weight: bold;
      color: #ff6666;
      margin-bottom: 10px;
    }
    .detail {
      margin: 8px 0;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 4px;
    }
    .label {
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .value {
      color: #e0e0e0;
      font-size: 14px;
      margin-top: 4px;
    }
    .donors {
      background: #333;
      padding: 10px;
      border-radius: 4px;
      margin-top: 8px;
    }
    .donor-item {
      padding: 4px 0;
      color: #ffaa66;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 Follow the Money</h1>
    <div class="subtitle">Exposing the funding behind propaganda</div>
  </div>

  <div id="organizations"></div>

  <div style="margin-top: 30px; padding: 20px; background: #2a2a2a; border-radius: 8px; text-align: center;">
    <p style="color: #999; font-size: 14px;">
      This data comes from public tax filings (IRS Form 990), investigative journalism, and transparency databases.
    </p>
    <p style="color: #cc6666; font-weight: bold; margin-top: 15px;">
      Every time you see their propaganda, remember: Someone is making money from spreading these lies.
    </p>
  </div>

  <script src="moneytrail.js"></script>
</body>
</html>
